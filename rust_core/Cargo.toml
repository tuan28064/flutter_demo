[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Flutter-Rust 桥接
flutter_rust_bridge = "2"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 文件系统监控
notify = "6"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志
log = "0.4"
env_logger = "0.10"

# 错误处理
anyhow = "1"
thiserror = "1"

# 文件类型检测
infer = "0.15"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 并行处理
rayon = "1.8"

# 模糊搜索
fuzzy-matcher = "0.3"

# 获取系统目录
dirs = "5"
